name: LiveToFrame
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  LiveToFrame:
    type: application
    platform: iOS
    sources: LiveToFrame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.livetoframe.personal
        MARKETING_VERSION: "0.16"
        CURRENT_PROJECT_VERSION: "16"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "实况转静态"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "读取你授权的实况照片，选中后将原有静态封面保存到相册。只有你确认后才会移除原件。"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R88SVJ66WP
  LiveToFrameTests:
    type: bundle.unit-test
    platform: iOS
    sources: LiveToFrameTests
    dependencies:
      - target: LiveToFrame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.livetoframe.personal.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R88SVJ66WP
  LiveToFrameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: LiveToFrameUITests
    dependencies:
      - target: LiveToFrame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.livetoframe.personal.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R88SVJ66WP
