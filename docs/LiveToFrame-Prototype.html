<!-- Apple-inspired design reference: #0066cc interaction blue, #1d1d1f ink, #f5f5f7 canvas, SF system typography.
     Adapted to a native photo workflow: real content leads, controls appear when needed, and deletion is separated from saving. -->
<style>
:root{color-scheme:light;--paper:#f5f5f7;--white:#fff;--ink:#1d1d1f;--dim:#66666c;--line:#e0e0e0;--soft:#f0f0f0;--blue:#0066cc;--tint:#eaf3ff;--danger:#b4232d;--success:#24744f;--warn:#87540c;--g:17px;font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
h1,h2,h3,p{margin:0}
button,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:transparent;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #0071e3;outline-offset:3px}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
[hidden]{display:none!important}
img{display:block;width:100%;height:100%;object-fit:cover}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.studio{max-width:1060px;margin:auto;padding:0 32px}
.studio-bar{min-height:62px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.identity{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:650}
.mark{display:block;width:32px;height:32px;border-radius:8px;object-fit:cover}
.platforms{display:flex;gap:3px;padding:3px;background:#e8e8ed;border-radius:12px}
.platforms button{min-height:44px;min-width:64px;padding:0 9px;font-size:14px;font-weight:600;border-radius:9px}
.platforms button[aria-pressed=true]{background:white;box-shadow:0 1px 3px #0002}
.platforms button:disabled{opacity:.6}
.scenarios{position:relative;justify-self:end;z-index:6}
.scenarios summary{min-height:44px;display:flex;align-items:center;gap:3px;cursor:pointer;color:var(--blue);font-size:14px;list-style:none}
.scenarios summary::-webkit-details-marker{display:none}
.scenarios summary .ic{width:13px;height:13px}
.scenarios .pop{position:absolute;top:calc(100% + 4px);right:0;width:170px;padding:4px 8px;background:white;border:1px solid var(--line);border-radius:11px;box-shadow:0 6px 22px #20203215}
.pop button{display:block;text-align:left;width:100%;padding:0 8px;min-height:44px;font-size:14px;border-radius:8px}
.pop button:hover{background:var(--paper)}
.workspace{display:grid;grid-template-columns:minmax(240px,1fr) minmax(360px,1.1fr);align-items:center;gap:clamp(28px,7vw,88px);min-height:calc(100svh - 62px);padding:24px 0}
.brief{min-width:0}
.brief h1{font-size:clamp(33px,4.4vw,54px);font-weight:660;letter-spacing:-.06em;line-height:1.16}
.brief .lede{font-size:16px;line-height:1.65;color:var(--dim);margin:10px 0 17px}
.brief .demo-button{width:auto;padding:0 16px;font-size:14px}
.demo-button .ic{width:16px;height:16px}
.studio-note{font-size:12px;color:var(--dim);margin:8px 0 22px}
.audit{border-top:1px solid var(--line)}
.audit summary{cursor:pointer;min-height:44px;align-content:center;font-size:14px;font-weight:650}
.audit dl{margin:0}
.audit dt{font-size:14px;font-weight:650;margin-top:9px}
.audit dd{font-size:13px;line-height:1.55;color:var(--dim);margin:3px 0 10px}
.preview-area{display:grid;justify-items:center;min-width:0}
.device{width:404px;max-width:100%;height:clamp(645px,calc(100svh - 151px),850px);background:var(--white);border:1px solid #d5d5d9;border-radius:39px;padding:6px;box-shadow:0 19px 55px #23233b15,0 1px 2px #0000000c}
#app{height:100%;position:relative;isolation:isolate;overflow:hidden;border:1px solid #e7e7e9;border-radius:33px;background:var(--white)}
#screen{height:100%;display:flex;flex-direction:column;min-height:0;padding-top:max(9px,env(safe-area-inset-top));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.nav{display:flex;flex:none;align-items:center;justify-content:space-between;min-height:47px;padding:0 var(--g);gap:4px;font-size:13px;color:var(--dim)}
.nav .inline-logo{display:flex;gap:6px;align-items:center;font-weight:600}
.inline-logo .ic{width:17px;height:17px}
.nav .text-btn{font-size:14px}
.scroll{flex:1;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;min-height:0}
#screen>.nav,#screen>.dock{position:relative;z-index:2;background:#ffffffcf;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#screen>.scroll{margin-top:calc(-1 * var(--nav-overlap,0px));margin-bottom:calc(-1 * var(--dock-overlap,0px))}
#screen>.scroll::before,#screen>.scroll::after{content:"";display:block;pointer-events:none}
#screen>.scroll::before{height:var(--nav-overlap,0px)}
#screen>.scroll::after{height:var(--dock-overlap,0px)}
#screen[data-screen-label="实况转静态"]>.scroll{touch-action:pan-y}
.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.title{padding:3px var(--g) 15px}
.title h2{font-size:34px;line-height:1.26;letter-spacing:-.374px;font-weight:650}
.title p{font-size:14px;color:var(--dim);line-height:1.43;margin-top:5px}
.gallery-controls{padding:0 var(--g) 8px}
.control-row{display:flex;gap:8px;align-items:center}
.segment{background:#ededf0;border-radius:11px;padding:3px;display:flex;flex:1;min-width:0}
.segment button{flex:1;min-height:37px;border-radius:8px;font-weight:550;font-size:14px}
.segment button[aria-pressed="true"]{background:var(--white);box-shadow:0 1px 3px #0002}
.filter{width:44px;height:44px;background:var(--paper);border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.filter.active{color:var(--blue);background:var(--tint)}
.filter.active::after{position:absolute;content:"";width:5px;height:5px;border-radius:50%;background:var(--blue);top:8px;right:9px}
.gallery-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:3px 8px;color:var(--dim);font-size:12px;line-height:1.5;margin-top:8px;min-height:22px}
.gallery-meta span{display:flex;align-items:center;gap:4px}
.gallery-meta svg{width:13px;height:13px}
.notice-line{margin:0 17px 6px;background:var(--tint);color:#184f82;border-radius:11px;padding:9px 12px;font-size:12px;line-height:1.5}
.shelf{padding:0 var(--g) 12px}
.day-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px}
.day-heading h3{font-size:17px;font-weight:650;letter-spacing:-.374px}
.day-heading h3 small{font-size:12px;color:var(--dim);font-weight:400;letter-spacing:0;margin-left:7px}
.day-heading h3,.day-heading button{white-space:nowrap}
.day-heading button{min-width:4em;flex:none;justify-content:flex-end}
.text-btn{color:var(--blue);font-size:14px;min-height:44px;display:inline-flex;justify-content:center;align-items:center;gap:5px;text-align:center}
.text-btn .ic{width:15px;height:15px}
.text-btn:hover{text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-radius:11px;overflow:hidden}
.gallery-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
.gallery-grid .tile{border-radius:3px}
#screen.compact-gallery .gallery-grid .tile :is(.live,.heart,.cloud,.select-dot){width:15px;height:15px}
#screen.compact-gallery .gallery-grid .tile .live{top:3px;left:3px}
#screen.compact-gallery .gallery-grid .tile :is(.heart,.cloud){bottom:3px;left:3px}
#screen.compact-gallery .gallery-grid .tile .select-dot{right:3px;bottom:3px}
#screen.compact-gallery .gallery-grid .tile :is(.live,.heart,.cloud,.select-dot) .ic{width:9px;height:9px}
.tile{position:relative;aspect-ratio:1;background:#e4e8eb;min-width:0;overflow:hidden;isolation:isolate;user-select:none;-webkit-touch-callout:none}
.tile img{pointer-events:none}
.tile .live{position:absolute;left:6px;top:6px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#19191975;color:#fff}
.live .ic{width:14px;height:14px}
.tile .cloud,.tile .heart{display:grid;place-items:center;position:absolute;bottom:6px;left:7px;color:#fff;background:#19191975;border-radius:50%;width:22px;height:22px}
.tile :is(.cloud,.heart) svg{width:13px;height:13px}
.tile .select-dot{display:grid;place-items:center;position:absolute;right:6px;bottom:6px;color:white;border:1.4px solid #fff;border-radius:50%;width:22px;height:22px;background:#0003;box-shadow:0 1px 3px #0003}
.select-dot svg{width:13px;height:13px;opacity:0}
.tile[aria-pressed=true]::after{content:"";position:absolute;inset:0;background:rgb(255 255 255 / 26%);pointer-events:none}
.tile[aria-pressed=true] .select-dot{background:var(--blue);z-index:1}
.tile[aria-pressed=true] .select-dot svg{opacity:1}
.tile:focus-visible{outline-offset:-4px;z-index:2}
@media(hover:hover){.tile:hover:not([aria-pressed=true]) .select-dot{background:#0007}}
.dock{padding:9px var(--g) max(13px,env(safe-area-inset-bottom));border-top:1px solid #e7e7e9;background:var(--white);flex:none}
.gallery-actions{display:grid;gap:8px}
.storage-estimate{display:grid;color:var(--dim);font-size:.8125rem;line-height:1.5}
.storage-estimate>span{grid-area:1/1}
.storage-estimate[aria-busy=true] .estimate-result,.storage-estimate[aria-busy=false] .estimate-progress{visibility:hidden}
.storage-estimate-value{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.storage-estimate-spinner{display:inline-block;width:12px;height:12px;margin-inline-start:4px;vertical-align:-1px;border:2px solid #0066cc38;border-top-color:var(--blue);border-radius:50%;animation:estimate-spin .7s linear infinite}
@keyframes estimate-spin{to{transform:rotate(360deg)}}
.primary,.secondary,.destructive,.quiet{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:12px;padding:8px 16px;font-size:1rem;line-height:1.25;font-weight:600;width:100%;text-align:center}
.primary{color:white;background:var(--blue)}
.primary:hover:not(:disabled){background:#0071e3}
.primary:disabled{color:#75757c;background:#eeeef1}
.secondary{color:var(--blue);background:var(--tint)}
.secondary:hover{background:#dcecff}
.quiet{color:var(--blue);font-size:14px}
.destructive{color:var(--danger);background:#fff0f1}
.destructive:hover{background:#fce4e7}
.empty{min-height:260px;display:grid;place-content:center;text-align:center;justify-items:center;padding:24px;gap:11px}
.empty .badge-icon{margin-bottom:3px}
.empty h3{font-size:19px;letter-spacing:-.3px}
.empty p{font-size:14px;line-height:1.5;color:var(--dim);max-width:24em}
.empty .text-btn{min-height:44px}
.badge-icon{display:grid;place-items:center;width:49px;height:49px;border-radius:15px;background:var(--tint);color:var(--blue)}
.badge-icon .ic{width:25px;height:25px}
.badge-icon.green{color:var(--success);background:#e7f5ec}
.badge-icon.amber{color:var(--warn);background:#fff3df}
.results-scroll{padding:4px var(--g) 20px}
.result-hero{padding:14px 0 20px}
.result-hero h2{font-size:29px;letter-spacing:-.8px;line-height:1.22;margin:12px 0 6px}
.result-hero p{font-size:14px;color:var(--dim);line-height:1.55}
.result-section{padding:12px 0 7px}
.result-section h3{font-size:16px;margin-bottom:7px}
.result-section p,.details p{font-size:12px;color:var(--dim);line-height:1.6;margin:4px 0 0}
.result-card{background:var(--paper);padding:0 12px;border-radius:11px}
.action-row{display:flex;width:100%;align-items:center;gap:10px;text-align:left;min-height:55px;padding:8px 0;color:var(--blue)}
.action-row+.action-row{border-top:1px solid #dfdfe4}
.action-row span{flex:1;font-weight:600;font-size:14px}
.action-row small{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:3px;line-height:1.4}
.action-row>.ic:last-child{width:15px;height:15px;color:#777780}
.result-list{margin:0;padding:0;list-style:none}
.list-row{display:flex;align-items:center;gap:10px;min-height:59px;padding:7px 0;border-bottom:1px solid #ebebef}
.list-row .thumb{width:43px;height:43px;border-radius:8px;overflow:hidden;flex:none;background:#e4e8eb}
.row-text{min-width:0;flex:1}
.row-text strong{display:block;font-size:13px;overflow-wrap:anywhere}
.row-text small{display:block;color:var(--dim);font-size:12px;margin-top:4px;line-height:1.38}
.status{font-size:12px;line-height:1.4;white-space:nowrap;border-radius:9999px;padding:4px 8px;background:var(--paper);color:var(--dim);font-weight:600}
.status.good{background:#e9f7ee;color:#216242}
.status.warn{background:#fff3df;color:#79500b}
.details{margin-top:13px;color:var(--dim);font-size:12px}
.details summary{padding:9px 0;cursor:pointer}
.details .text-btn{font-size:12px}
#layer{position:absolute;inset:0;z-index:3;background:#16161b66;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease-out}
#layer.fullpreview{align-items:center;background:#15151ad1;backdrop-filter:blur(9px);padding:17px;cursor:pointer}
.sheet{position:relative;display:flex;flex-direction:column;overflow:hidden;background:white;width:100%;border-radius:25px 25px 0 0;box-shadow:0 -5px 28px #0002}
.sheet.sheet-enter{animation:sheet-in .23s cubic-bezier(.19,.76,.39,1)}
.sheet-header{display:flex;align-items:center;justify-content:space-between;min-height:57px;padding:8px 17px 0;flex:none}
.sheet-header h2{font-size:20px;letter-spacing:-.35px}
.sheet-body{padding:1px 17px 14px;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none}
.sheet-body>p{font-size:14px;line-height:1.55;color:var(--dim);margin:1px 0 10px}
.sheet-footer{padding:9px 17px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--soft);background:white;display:grid;gap:5px}
.sheet-intro{background:var(--paper);border-radius:11px;padding:12px;font-size:13px;line-height:1.55;margin-bottom:8px}
.switchrow{width:100%;display:flex;min-height:66px;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--soft);text-align:left}
.switchrow strong{display:block;font-size:15px}
.switchrow small{font-size:12px;color:var(--dim);display:block;margin-top:3px;line-height:1.35}
.switch{width:43px;height:26px;background:#dedee3;position:relative;border-radius:9999px;flex:none;transition:background .15s}
.switch::after{content:"";width:22px;height:22px;border-radius:50%;background:white;position:absolute;top:2px;left:2px;box-shadow:0 1px 2px #0002;transition:translate .15s}
[aria-checked=true] .switch{background:var(--blue)}
[aria-checked=true] .switch::after{translate:17px 0}
.cat-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;margin:8px 0 1px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border-radius:9999px;min-height:44px;padding:0 12px;background:var(--paper);font-size:13px}
.chips button[aria-pressed=true]{color:var(--blue);background:var(--tint);font-weight:600}
.small-icon{border-radius:50%;color:var(--blue);background:var(--tint);display:grid;place-items:center;width:44px;height:44px;flex:none}
.small-icon .ic{width:17px;height:17px}
.warning{background:#fff4e5;border-radius:8px;padding:8px 12px;font-size:13px;color:#69450f;line-height:1.55;margin:12px 0 4px}
.preview-photo{max-height:76%;max-width:100%;width:100%;position:relative;border-radius:18px;overflow:hidden;background:#292929}
.preview-photo img{height:auto;aspect-ratio:4/3;object-fit:cover;animation:live-one 1.75s ease-in-out both}
.preview-photo .live-pill{position:absolute;top:10px;left:10px;border-radius:9999px;padding:5px 8px;background:#0008;color:#fff;font-size:10px;display:flex;align-items:center;gap:4px}
.live-pill .ic{width:13px;height:13px}
.preview-photo .sr:focus-visible{width:auto;height:auto;clip-path:none;bottom:8px;right:8px;margin:0;background:white;color:var(--blue);padding:6px 12px;border-radius:9999px}
.system-dialog{align-self:center;width:calc(100% - 46px);max-width:300px;text-align:center;background:#f9f9fb;border-radius:18px;overflow:hidden;box-shadow:0 10px 32px #0002;animation:fade .15s}
.system-dialog h2{font-size:17px;margin:17px 13px 6px}
.system-dialog p{font-size:13px;line-height:1.48;padding:0 15px 14px;color:var(--dim)}
.system-buttons{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.system-buttons button{min-height:46px;color:var(--blue);font-size:15px}
.system-buttons button+button{border-left:1px solid var(--line);color:var(--danger);font-weight:600}
.progress-wrap{display:flex;flex:1;align-items:center;padding:24px;min-height:0}
.progress-content{width:100%}
.progress-content h2{font-size:26px;margin:13px 0 7px}
.progress-content p{font-size:14px;line-height:1.6;color:var(--dim)}
.track{height:5px;background:#e8e8ed;border-radius:9999px;margin:19px 0 10px;overflow:hidden}
.track span{display:block;background:var(--blue);height:100%;border-radius:9999px;transform:scaleX(var(--progress));transform-origin:left;transition:transform .26s ease}
#toast{pointer-events:none;position:absolute;z-index:5;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;translate:-50% 0;width:max-content;max-width:calc(100% - 38px);padding:10px 13px;background:#252528;color:white;border-radius:11px;font-size:13px;line-height:1.5;box-shadow:0 3px 14px #0002;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet-in{from{transform:translateY(22px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes live-one{0%,100%{transform:scale(1)}45%{transform:scale(1.048) translateY(-1%)}}
/* Android navigation and simulated system confirmation. */
#app[data-platform=android] .system-dialog{text-align:left;background:#edeff9;border-radius:26px;padding:20px}
#app[data-platform=android] .system-dialog h2{margin:4px 0 10px}
#app[data-platform=android] .system-dialog p{padding:0 0 12px}
#app[data-platform=android] .system-buttons{display:flex;justify-content:flex-end;gap:16px;border:0}
#app[data-platform=android] .system-buttons button{padding:0 5px;border:0}
#app[data-platform=android] .nav:has(.back-control){justify-content:flex-start;padding-left:4px}
#app[data-platform=android] .back-control{color:var(--ink);width:44px}
#app[data-platform=android] .back-control .ic{width:22px;height:22px}
#screen{padding-top:0}
#screen>.nav,#screen>.dock{z-index:1;background:var(--white);backdrop-filter:none}
#screen>.scroll{margin:0}
#screen>.scroll::before,#screen>.scroll::after{display:none}
.nav{min-height:52px;gap:8px}
.nav h2{font-size:1.3125rem;color:var(--ink);font-weight:650;min-width:0;line-height:1.2}
.nav .text-btn{flex:none}
.nav strong{color:var(--ink);font-size:15px}
.gallery-controls{flex:none;padding:4px var(--g) 8px;border-bottom:1px solid var(--soft)}
.gallery-controls .control-row{flex-wrap:wrap}
.gallery-controls .segment{flex:1 1 104px;max-width:156px;margin-inline-end:auto}
.gallery-controls .filter{width:auto;padding:0 12px;display:inline-flex;gap:4px;font-size:.875rem;font-weight:600;border-radius:12px;white-space:nowrap}
.gallery-controls .filter .ic{width:16px;height:16px}
.gallery-controls .filter.active::after{display:none}
.gallery-controls .segment button{min-height:44px}
.gallery-meta{margin-top:4px;min-height:20px;line-height:1.45}
.gallery-meta button{min-height:44px;max-width:100%}
.gallery-meta:has(button){justify-content:flex-start}
.gallery-meta .first-use-hint{color:var(--dim);font-size:12px}
.control-row>.selection-toggle{flex:none;white-space:nowrap;padding:0 8px;min-height:44px;font-size:.8125rem;color:var(--blue);border-radius:12px}
.control-row>.selection-toggle[aria-pressed=true]{background:var(--tint);font-weight:650}
.control-row>.selection-toggle:disabled{color:var(--dim);opacity:.5}
.notice-line{margin:7px var(--g) 3px}
.shelf{padding-bottom:10px}
.day-heading h3{min-width:0;white-space:normal}
.day-heading h3 small{display:inline-block;margin-left:6px}
.day-heading button.day-select{display:grid;place-items:center end;flex:0 0 44px;min-width:44px;min-height:44px}
.day-select-box{display:grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--dim);border-radius:6px}
.day-select[aria-pressed="true"] .day-select-box{color:white;background:var(--blue);border-color:var(--blue)}
.day-select[aria-pressed="mixed"] .day-select-box{color:var(--blue);background:var(--tint);border-color:var(--blue)}
.day-select-box .ic{width:13px;height:13px}
.gallery-viewport{position:relative;display:flex;flex:1;min-height:0}
.gallery-viewport>.scroll{min-width:0;touch-action:pan-y;overflow-anchor:none;isolation:isolate}
.gallery-viewport .gallery-grid{border-radius:4px}
.date-rail{position:absolute;z-index:1;right:3px;inset-block:4px;width:39px;pointer-events:none;--thumb-height:48px;--thumb-offset:0px}
.date-rail input{writing-mode:vertical-lr}
.date-thumb{position:absolute;top:var(--thumb-offset);width:100%;height:var(--thumb-height);
  display:grid;place-items:center;opacity:0;pointer-events:none;touch-action:none;cursor:ns-resize;transition:opacity .16s ease}
.date-rail.is-shown .date-thumb,.date-rail:focus-within .date-thumb{opacity:1;pointer-events:auto}
.date-thumb-face{width:33px;height:46px;display:grid;align-content:center;justify-items:center;gap:4px;
  color:var(--ink);background:var(--white);border-radius:999px;box-shadow:0 2px 8px rgb(0 0 0 / 22%)}
.date-thumb-face::before,.date-thumb-face::after{content:"";border-inline:5px solid transparent}
.date-thumb-face::before{border-bottom:5px solid currentColor}
.date-thumb-face::after{border-top:5px solid currentColor}
.date-rail input:focus-visible+.date-thumb .date-thumb-face{outline:2px solid var(--blue);outline-offset:1px}
.date-label{position:absolute;right:43px;top:calc(var(--thumb-offset) + 8px);
  padding:7px 12px;border-radius:999px;background:var(--white);color:var(--ink);box-shadow:0 2px 8px rgb(0 0 0 / 15%);
  font-size:13px;font-weight:600;white-space:nowrap}
.date-rail[hidden],.date-label[hidden]{display:none}
.dock{padding:8px var(--g) max(12px,env(safe-area-inset-bottom))}
.dock:empty{display:none}
.dock-top{display:grid;gap:4px;margin-bottom:8px}
.dock-heading{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;column-gap:8px}
.selection-summary{font-size:1rem;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.dock-caption{font-size:.75rem;line-height:1.5;color:var(--dim)}
.gallery-actions{grid-template-columns:minmax(0,2fr) minmax(0,3fr);align-items:center}
.gallery-actions button{padding-inline:8px}
.gallery-actions .quiet{color:var(--ink);background:var(--paper);font-size:.875rem}
.gallery-actions .quiet:hover{background:var(--soft)}
.results-scroll{padding-block:4px 24px}
.result-hero{padding:12px 0 16px}
.result-hero h2{font-size:1.5rem;margin:0 0 8px;letter-spacing:-.55px}
.result-section{padding:20px 0 0}
.result-section h3{font-size:1rem;margin-bottom:4px}
.result-section h3 small{margin-inline-start:8px;font-size:.8125rem;color:var(--dim);font-weight:400}
.result-section .action-row{min-height:44px}
.result-originals{margin-top:20px;background:var(--paper);border-radius:12px;padding:12px 12px 4px}
.result-originals h3{font-size:.875rem}
.action-row.action-danger{color:var(--danger)}
.result-list .status{max-width:95px;white-space:normal;text-align:center;flex:none}
.row-tools{display:flex;align-items:center;gap:4px}
.row-tools .text-btn{min-width:44px;padding-inline:5px}
.sheet,.sheet.filter-sheet{height:auto;max-height:calc(100% - 16px)}
.sheet-header{min-height:60px;padding-top:4px;gap:8px}
.sheet-header h2{min-width:0;font-size:1.25rem}
.sheet-body{padding-bottom:12px;overflow-anchor:none}
.sheet-body .filter-notice{background:var(--tint);color:#184f82;border-radius:8px;padding:8px 12px;margin:8px 0 0;font-size:13px}
.sheet-footer{flex:none}
.sheet.trash-sheet{max-height:min(75%,580px)}
.trash-sheet .sheet-body{flex:0 1 auto}
.trash-sheet .sheet-intro{background:transparent;padding:2px 0;margin-bottom:4px;font-size:14px;font-weight:600}
.trash-sheet .sheet-body>p{margin-bottom:5px;color:var(--dim)}
.trash-sheet .sheet-footer{padding-block-start:10px}
.trash-sheet .destructive{border-radius:12px}
.sheet-footer .text-btn{justify-self:center}
.sheet-header .small-icon,.preview-photo .small-icon{background:var(--paper);color:var(--ink)}
.switchrow{min-height:52px;padding-block:5px;gap:12px}
.switchrow small{line-height:1.45}
.check-row{display:grid;place-items:center;flex:0 0 44px;min-height:49px}
.check-box{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--dim);border-radius:5px;color:transparent}
[aria-checked=true] .check-box{background:var(--blue);border-color:var(--blue);color:white}
.check-box .ic{width:16px;height:16px}
.destructive:disabled,.text-btn:disabled{opacity:.5}
#layer.fullpreview{cursor:default;padding:12px}
.preview-photo{max-height:100%;display:flex;flex-direction:column;color:white}
.preview-bar,.preview-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px;flex:none}
.preview-bar{padding-top:4px}
.preview-bar h2{font-size:15px;line-height:1.3}
.preview-preview{min-height:0;overflow:hidden;flex:1}
.preview-preview img{max-height:min(55dvh,520px);aspect-ratio:auto;object-fit:contain;animation:none}
.preview-preview img.is-playing{animation:live-one 1.75s ease-in-out both}
.preview-photo .text-btn{color:white}
.preview-actions span{color:#ddd;font-size:12px}
.preview-photo .small-icon{width:44px;height:44px;background:transparent;color:white}
.system-dialog h2:first-child{margin-top:19px}
#toast{bottom:104px}
@media(max-width:760px){
  :root{--g:16px}
  .studio{padding:0}
  .studio-bar{min-height:56px;padding:0 12px;position:relative}
  .identity{font-size:13px}
  .workspace{display:flex;flex-direction:column;gap:0;min-height:0;padding:0}
  .preview-area{width:100%}
  .device{width:100%;height:calc(100dvh - 56px);min-height:380px;max-width:none;border:0;padding:0;border-radius:0;box-shadow:none}
  #app{border:none;border-radius:0}
  .brief{order:2;padding:20px max(14px,env(safe-area-inset-left)) 24px;width:100%;max-width:500px}
  .brief h1{font-size:23px}
  .brief .lede{font-size:14px}
}
@media(max-width:355px){
  :root{--g:12px}
  .mark{display:none}
  .studio-bar{gap:5px}
  .platforms button{min-width:57px;padding-inline:7px}
  .sheet-header,.sheet-body,.sheet-footer{padding-inline:12px}
  .gallery-controls .filter{padding-inline:8px}
  .control-row>.selection-toggle{padding-inline:6px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

      <dl>
        <dt>选择与保存</dt>
        <dd>轻点选择，长按预览。横划可批量选择，从已选照片起手则批量撤选。日期右侧的勾选框控制当天可见照片。</dd>
        <dt>按日期快滚</dt>
        <dd>滚动时右侧会出现快滚把手。拖住把手，日期浮标和照片网格会随拖动更新。</dd>
        <dt>筛选与核对</dt>
        <dd>点「显示 N 张照片」应用筛选，关闭返回原状态。筛选隐藏已选照片时，「核对后保存」会打开完整清单。</dd>
        <dt>平台差异</dt>
        <dd id="platform-note">iOS 支持内容分类、导出可读封面，并在移除原件前展示 iCloud 同步提醒。</dd>

function estimate(items){

let disposeDateRail;
function bindDateRail(){
  disposeDateRail?.();
  const viewport=screen.querySelector(".gallery-viewport");
  if(!viewport)return;
  const scroll=viewport.querySelector(".scroll"),rail=viewport.querySelector(".date-rail");
  const input=rail.querySelector("input"),thumb=rail.querySelector(".date-thumb"),label=rail.querySelector(".date-label");
  const rows=[];
  for(const shelf of scroll.querySelectorAll(".shelf")){
    const heading=shelf.querySelector(".day-heading");
    const tiles=shelf.querySelectorAll(".gallery-grid .tile");
    for(let i=0;i<tiles.length;i+=5){
      rows.push({anchor:i===0&&heading?heading:tiles[i],day:getPhoto(Number(tiles[i].dataset.id)).day});
    }
  }
  const last=rows.length-1;
  input.max=Math.max(0,last);
  const listeners=new AbortController();
  const {signal}=listeners;
  let drag=null,hideTimer,frame=null,targetRow=0,requestedRow=-1;
  const travel=()=>Math.max(1,rail.clientHeight-thumb.offsetHeight);
  const topFor=el=>el.getBoundingClientRect().top-scroll.getBoundingClientRect().top+scroll.scrollTop;
  function paint(index,fraction=index/last){
    const date=days[rows[index].day].full;
    rail.style.setProperty("--thumb-offset",fraction*travel()+"px");
    input.value=index;
    input.setAttribute("aria-valuetext",date);
    label.textContent=date;
  }
  function reflectScroll(){
    rail.hidden=last<1||scroll.scrollHeight<=scroll.clientHeight+1;
    if(rail.hidden||drag)return;
    const atBottom=scroll.scrollTop+scroll.clientHeight>=scroll.scrollHeight-1;
    const index=atBottom?last:rows.findLastIndex(row=>topFor(row.anchor)<=scroll.scrollTop+1);
    paint(Math.max(0,index));
  }
  function reveal(){
    if(rail.hidden)return;
    rail.classList.add("is-shown");
    clearTimeout(hideTimer);
    if(!drag)hideTimer=setTimeout(()=>rail.classList.remove("is-shown"),1350);
  }
  function seek(index){
    if(index===0)scroll.scrollTop=0;
    else if(index===last)scroll.scrollTop=scroll.scrollHeight;
    else scroll.scrollTop=topFor(rows[index].anchor);
  }
  function seekRequestedRow(){
    frame=null;
    if(requestedRow===targetRow)return;
    requestedRow=targetRow;
    seek(targetRow);
  }
  function dragTo(e){
    const distance=e.clientY-drag.y;
    if(!drag.started&&Math.abs(distance)<4)return;
    drag.started=true;
    const fraction=Math.min(1,Math.max(0,drag.fraction+distance/travel()));
    targetRow=Math.round(fraction*last);
    paint(targetRow,fraction);
    label.hidden=false;
    if(frame===null)frame=requestAnimationFrame(seekRequestedRow);
  }
  thumb.addEventListener("pointerdown",e=>{
    if(e.button!==0||!e.isPrimary||drag)return;
    e.preventDefault();
    drag={pointer:e.pointerId,y:e.clientY,fraction:Number(input.value)/last,started:false};
    requestedRow=-1;
    reveal();
  });
  window.addEventListener("pointermove",e=>{if(drag?.pointer===e.pointerId)dragTo(e)},{signal});
  function endDrag(e){
    if(drag?.pointer!==e.pointerId)return;
    if(e.type==="pointerup")dragTo(e);
    cancelAnimationFrame(frame);
    frame=null;
    if(e.type==="pointerup"&&drag.started)seekRequestedRow();
    drag=null;
    label.hidden=true;
    reflectScroll();
    reveal();
  }
  window.addEventListener("pointerup",endDrag,{signal});
  window.addEventListener("pointercancel",endDrag,{signal});
  input.addEventListener("input",()=>{seek(Number(input.value));reflectScroll();reveal()});
  scroll.addEventListener("scroll",()=>{reflectScroll();reveal()},{passive:true,signal});
  if(isAndroid())scroll.addEventListener("pointerdown",reveal,{passive:true,signal});
  const observer=new ResizeObserver(reflectScroll);
  observer.observe(scroll);
  reflectScroll();
  if(!isAndroid())reveal();
  disposeDateRail=()=>{
    clearTimeout(hideTimer);
    cancelAnimationFrame(frame);
    observer.disconnect();
    listeners.abort();
  };
}

    const p=getPhoto(r.id);
    const checkbox=button("cleanup-toggle",'<span class="check-box">'+icon("check")+'</span>',"check-row",
      'data-id="'+p.id+'" data-key="cleanup-'+p.id+'" role="checkbox" aria-checked="'+s.cleanup.has(p.id)+'" aria-label="选择 '+nameFor(p)+' 的原件"');
    return photoRow(p,checkbox);
  });
  if(isAndroid()){
    const summary=count
      ?'<div class="sheet-intro">清空回收站后预计节省 '+e.value+'</div>'
      :'<div class="sheet-intro">请选择要移入回收站的原件</div>';
    return sheet("移入回收站前核对",summary+
      '<p>下列照片的静态副本已核验。原件移入后可在系统相册的「最近删除」或「回收站」恢复。</p>'+
      '<ul class="result-list">'+rows.join("")+'</ul>',
      button("confirm-remove",count?"移入回收站（"+count+" 张）":"移入回收站","destructive",count?"":"disabled"),"trash-sheet");
  }
  const warning="开启 iCloud 照片时，移除会同步到其他设备。实际节省空间取决于存储状态。";
  return sheet("移除原件前核对",
    '<p>仅列出副本已核验、可提交复核的原件。取消勾选可保留对应原件。</p>'+intro+
    '<ul class="result-list">'+rows.join("")+'</ul><p class="warning">'+warning+'</p>',
    button("confirm-remove",count?"复核并继续移除（"+count+" 张）": "请选择原件","destructive",count?"":"disabled"));
}
function systemDialog(){
  const count=s.cleanup.size;
  const title=isAndroid()?"将 "+count+" 张原件移入回收站？":"允许「实况转静态」删除 "+count+" 张照片？";
  const msg=isAndroid()?"静态副本仍在相册。原件可从系统相册的回收站恢复。":"静态副本仍在相册。";
  return '<div class="system-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">'+
    '<h2 id="modal-title" tabindex="-1">'+title+'</h2><p>'+msg+'</p><div class="system-buttons">'+
    button("cancel-remove","取消","")+button("commit-remove",isAndroid()?"移入回收站":"删除","")+'</div></div>';
}
function recoverySheet(){
  return sheet("恢复原件",'<p>打开系统相册，在「图集」中找「最近删除」或「回收站」，选择要恢复的原件。恢复后可以在原相册找到它。</p>',button("close","返回结果","primary"));
}
function exportSheet(){
  return sheet("导出静态封面",'<p>下载可读的示例封面。导出文件不会影响相册原件，也不会改变核验状态。</p><ul class="result-list">'+unverified().map(r=>{const p=getPhoto(r.id);return photoRow(p,button("download","下载","text-btn",'data-id="'+p.id+'" data-key="download-'+p.id+'" aria-label="下载 '+p.name+' 的示例封面"'))}).join("")+'</ul>');
}
function permissionsSheet(){
  return sheet("照片访问",'<p>原型使用示例相册。正式 App 只读取系统授权范围内的照片。</p><div class="result-card">'+actionRow("allow-limited","lock","允许访问部分照片","显示前 4 张示例实况")+actionRow("allow-full","photos","允许访问全部照片","显示完整示例相册")+actionRow("deny","x","暂不授权","返回未授权状态")+'</div>');
}
function renderLayer(){
  const oldBody=layer.querySelector(".sheet-body");
  const entering=layer.hidden||layer.dataset.modal!==s.modal;
  const old=entering?0:oldBody?.scrollTop||0;
  layer.dataset.modal=s.modal;
  const isPreview=["preview","still"].includes(s.modal);
  layer.className=isPreview?"fullpreview":"";
  layer.hidden=false;
  if(isPreview){
    const p=getPhoto(s.previewId),live=s.modal==="preview";
    const back=s.previewSource==="review"?button("return-review","返回清单","text-btn"):button("close",icon("x"),"small-icon",'aria-label="关闭预览"');
    layer.innerHTML='<div class="preview-photo" role="dialog" aria-modal="true" aria-labelledby="modal-title">'+
      '<div class="preview-bar"><h2 id="modal-title" tabindex="-1">'+p.name+'</h2>'+back+'</div>'+
      '<div class="preview-preview">'+img(p)+'</div><div class="preview-actions">'+
      '<span>'+(live?"实况照片 · 模拟":"静态副本")+'</span>'+
      (live?button("replay","重播动态","text-btn"):"")+'</div></div>';
    if(live)layer.querySelector("img").classList.add("is-playing");
  }else{
    const make={filter:filterSheet,review:reviewSheet,remove:removeSheet,system:systemDialog,permissions:permissionsSheet,export:exportSheet,recovery:recoverySheet};
    layer.innerHTML=make[s.modal]();
    const body=layer.querySelector(".sheet-body");
    if(body){
      body.scrollTop=old;
      if(entering)body.closest(".sheet").classList.add("sheet-enter");
    }
  }
}
function openModal(which){
  if(which==="filter"){
    clearTimeout(toastTimer);toastEl.hidden=true;
    s.filterDraft={exclude:s.exclude,cat:s.cat};
  }
  returnFocus=focusKey(document.activeElement);s.modal=which;renderLayer();screen.inert=true;
  layer.querySelector("#modal-title")?.focus({preventScroll:true});
}
function closeModal(){
  if(s.modal==="preview"&&s.previewSource==="review"){
    s.previewSource=null;s.modal="review";renderLayer();
    const body=layer.querySelector(".sheet-body");if(body)body.scrollTop=s.reviewTop;
    layer.querySelector('[data-a="review-preview"][data-id="'+s.previewId+'"]')?.focus({preventScroll:true});
    return;
  }
  const key=returnFocus;s.modal=null;s.filterDraft=null;returnFocus=null;render({focus:key||"heading"});
}
function refreshFilterSheet(key=focusKey(document.activeElement)){
  renderLayer();
  (findFocus(layer,key)||layer.querySelector("#modal-title"))?.focus({preventScroll:true});
}
function applyFilter(){
  const {exclude,cat}=s.filterDraft;
  const categoryChanged=cat!==s.cat;
  s.exclude=exclude;s.cat=cat;
  let removed=0;
  if(exclude){
    for(const photo of available()){
      if(photo.favorite&&s.selected.delete(photo.id))removed++;
    }
  }
  closeModal();
  if(categoryChanged)screen.querySelector(".gallery-viewport .scroll").scrollTop=0;
  if(removed)toast("已撤选 "+removed+" 张受保护的收藏");
}
function setPicked(p,on){if(on)s.selected.add(p.id);else s.selected.delete(p.id)}
async function save(){
  const picks=picked();if(s.screen!=="gallery"||!picks.length)return;
  const ticket=++revision;s.batchSize=picks.length;s.phase="save";s.work=0;setScreen("progress");
  for(let k=1;k<3;k++){await timer(425);if(ticket!==revision)return;s.work=k;render()}
  await timer(470);if(ticket!==revision)return;
  s.results=picks.map(p=>({id:p.id,status:p.outcome||"verified"}));s.selected.clear();s.only=false;setScreen("results");
}
async function prepareRemove(){
  if(!s.cleanup.size)return;
  const ticket=++revision;s.phase="remove";s.work=1;setScreen("progress");await timer(500);
  if(ticket!==revision)return;
  const eligible = new Set(available().filter(p=>!p.changedBeforeRemoval&&!p.favorite).map(p=>p.id));
  let rejected=0;
  for(const row of verified()){
    if(s.cleanup.has(row.id)&&!eligible.has(row.id)){
      row.status="retained";s.cleanup.delete(row.id);rejected++;
    }
  }
  setScreen("results");
  if(!s.cleanup.size){toast("没有原件通过复核，本次原件全部保留");return}
  if(rejected)toast(rejected+" 张原件未通过复核，已保留");
  openModal("system");returnFocus="remove";
}
function commitRemove(){
  for(const r of verified()){
    if(s.cleanup.has(r.id)){r.status="removed";s.removed.add(r.id)}
  }
  s.cleanup.clear();
  setScreen("results");toast("静态副本仍在相册");
}
function toggleDay(button){
  const index=Number(button.dataset.id),items=visible().filter(p=>p.day===index);
  const next=items.some(p=>!s.selected.has(p.id));
  items.forEach(p=>setPicked(p,next));
  finishSelection();
}
function refreshSelectionMarks(){
  for(const shelf of screen.querySelectorAll(".gallery-viewport .shelf")){
    const tiles=[...shelf.querySelectorAll(".tile")];
    let count=0;
    for(const tile of tiles){
      const selected=s.selected.has(Number(tile.dataset.id));
      tile.setAttribute("aria-pressed",String(selected));
      if(selected)count++;
    }
    const day=shelf.querySelector(".day-select");
    if(!day)continue;
    shelf.querySelector("h3 small").textContent=(count?count+" 已选 · ":"")+tiles.length+" 张";
    const state=daySelectionState(count,tiles.length);
    if(day.getAttribute("aria-pressed")!==state){
      day.innerHTML=daySelectionMark(state);
      day.setAttribute("aria-pressed",state);
      day.setAttribute("aria-label",daySelectionLabel(Number(day.dataset.id),state));
    }
  }
}
function dismissGalleryHint(){
  showGalleryHint=false;
  const hint=screen.querySelector(".first-use-hint");
  if(hint)hint.hidden=true;
}
function finishSelection(){
  dismissGalleryHint();
  const selected=picked();
  if(s.only){
    render();
  }else{
    refreshSelectionMarks();
    screen.querySelector('[data-a="only"]').disabled=!selected.length;
    const notice=screen.querySelector(".notice-line");
    const hidden=hiddenCount();
    if(notice){
      if(hidden)notice.textContent="筛选藏起了 "+hidden+" 张已选照片，保存前可核对。";
      else notice.remove();
    }
    screen.querySelector(":scope>.dock").innerHTML=galleryDockContents(selected,hidden);
  }
  announce("已选 "+selected.length+" 张照片");
}
function setGalleryMode(mode){
  if(s.mode===mode)return;
  s.mode=mode;
  render({preserve:false});
  fadeIn(screen.querySelector(".scroll"));
}
function authorize(value){
  s.access=value;if(s.access!=="none")s.empty=false;
  s.selected=new Set(picked().map(p=>p.id));
  if(s.screen==="gallery")setScreen("gallery");else closeModal();
}
const actions={
  gallery:()=>setScreen("gallery"),results:()=>setScreen("results"),copies:()=>setScreen("copies"),
  days:()=>setGalleryMode("days"),all:()=>setGalleryMode("all"),
  filter:()=>openModal("filter"),review:()=>openModal("review"),recovery:()=>openModal("recovery"),
  remove:()=>{
    s.cleanup=new Set(verified().filter(row=>!getPhoto(row.id).favorite).map(row=>row.id));
    openModal("remove");
  },
  "cleanup-toggle":el=>{
    const id=Number(el.dataset.id);
    if(s.cleanup.has(id))s.cleanup.delete(id);else s.cleanup.add(id);
    render();
  },
  permissions:()=>openModal("permissions"),"allow-full":()=>authorize("full"),"allow-limited":()=>authorize("limited"),deny:()=>authorize("none"),
  "clear-view":()=>{s.only=false;s.cat="全部类别";render({preserve:false,focus:"filter"})},
  close:closeModal,
  favorites:()=>{s.filterDraft.exclude=!s.filterDraft.exclude;refreshFilterSheet()},
  "apply-filter":applyFilter,
  only:()=>{if(picked().length){s.only=!s.only;render()}},
  classify:async()=>{
    const ticket=revision;s.classifying=true;refreshFilterSheet();
    await timer(450);
    if(ticket!==revision)return;
    s.classifying=false;s.classified=true;
    if(s.modal==="filter"){refreshFilterSheet("category-0");announce("示例照片已分类")}
  },
  category:el=>{s.filterDraft.cat=cats[Number(el.dataset.id)];refreshFilterSheet()},
  day:toggleDay,
  tile:el=>{
    const p=getPhoto(Number(el.dataset.id));
    setPicked(p,!s.selected.has(p.id));
    finishSelection();
  },
  still:el=>{s.previewSource=null;s.previewId=Number(el.dataset.id);openModal("still")},
  "review-preview":el=>{
    s.reviewTop=layer.querySelector(".sheet-body")?.scrollTop||0;
    s.previewSource="review";s.previewId=Number(el.dataset.id);s.modal="preview";renderLayer();
    layer.querySelector("#modal-title")?.focus({preventScroll:true});
  },
  "return-review":closeModal,
  replay:()=>{
    const image=layer.querySelector(".preview-preview img");
    image.classList.remove("is-playing");
    void image.offsetWidth;
    image.classList.add("is-playing");
    announce("正在重播实况照片示例");
  },
  unpick:el=>{s.selected.delete(Number(el.dataset.id));render({focus:layer.querySelector('[data-key^="unpick-"]')?.dataset.key||"close"});if(!layer.contains(document.activeElement))layer.querySelector("#modal-title")?.focus()},
  "clear-selection":()=>{s.selected.clear();s.only=false;render();announce("已取消所有照片选择")},
  save,
  "confirm-remove":prepareRemove,
  "cancel-remove":()=>{closeModal();toast("已取消移除，副本和原件均保留")},
  "commit-remove":commitRemove,
  export:()=>openModal("export"),
  download:el=>{const p=getPhoto(Number(el.dataset.id));const a=document.createElement("a");a.href=images[p.imageIndex ?? p.id];a.download="示例封面-"+p.file.replace(".HEIC",".jpg");a.click();toast("已请求下载一张示例封面；相册原件未改变")}
};
document.addEventListener("click",e=>{
  const platformButton=e.target.closest(".platforms [data-platform]");
  if(platformButton&&!platformButton.disabled){switchPlatform(platformButton.dataset.platform);return}
  const demo=e.target.closest("[data-demo]");
  if(demo){reset(demo.dataset.demo);return}
  const scenarios=document.querySelector(".scenarios");
  if(!scenarios.contains(e.target))scenarios.open=false;
  const el=e.target.closest("[data-a]");
  if(el?.dataset.a==="tile"&&e.detail>0&&suppressTileClick){suppressTileClick=false;return}
  if(el&&!el.disabled){actions[el.dataset.a]?.(el);return}
  if(e.target===layer&&s.modal){if(s.modal==="system")actions["cancel-remove"]();else closeModal()}
});
function preview(id){if(s.screen!=="gallery"||s.modal)return;dismissGalleryHint();s.previewSource=null;s.previewId=id;openModal("preview")}
function stopPress(){if(press)clearTimeout(press.timer);press=null}
app.addEventListener("pointerdown",e=>{
  const tile=e.target.closest('[data-a="tile"]');
  if(!tile||e.button!==0||!e.isPrimary||s.modal||range)return;
  stopPress();suppressTileClick=false;
  const id=Number(tile.dataset.id);
  press={id,tile,x:e.clientX,y:e.clientY,pointer:e.pointerId,timer:setTimeout(()=>{
    stopPress();suppressTileClick=true;tile.focus({preventScroll:true});preview(id);
  },460)};
});
function selectRangeAt(end){
  if(end<0||end===range.end)return;
  range.end=end;
  s.selected=new Set(range.base);
  const first=Math.min(range.start,end),last=Math.max(range.start,end);
  for(const id of range.ids.slice(first,last+1)){
    if(range.selecting)s.selected.add(id);
    else s.selected.delete(id);
  }
  refreshSelectionMarks();
}
window.addEventListener("pointermove",e=>{
  if(press&&e.pointerId===press.pointer){
    const dx=Math.abs(e.clientX-press.x),dy=Math.abs(e.clientY-press.y);
    if(Math.max(dx,dy)<12)return;
    const {id,tile}=press;
    stopPress();suppressTileClick=true;
    if(s.only||dx<dy*1.25||s.modal)return;
    const ids=visible().map(photo=>photo.id),start=ids.indexOf(id);
    if(start<0)return;
    range={ids,start,end:-1,base:new Set(s.selected),selecting:!s.selected.has(id),pointer:e.pointerId};
    tile.setPointerCapture(e.pointerId);
    selectRangeAt(start);
  }
  if(range&&e.pointerId===range.pointer){
    const tile=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-a="tile"]');
    if(tile)selectRangeAt(range.ids.indexOf(Number(tile.dataset.id)));
  }
});
function endPointer(e){
  if(press?.pointer===e.pointerId)stopPress();
  if(range?.pointer!==e.pointerId)return;
  const canceled=e.type==="pointercancel";
  if(canceled)s.selected=range.base;
  range=null;
  if(canceled)refreshSelectionMarks();
  else finishSelection();
}
window.addEventListener("pointerup",endPointer);
window.addEventListener("pointercancel",endPointer);
app.addEventListener("contextmenu",e=>{
  const tile=e.target.closest('[data-a="tile"]');
  if(!tile&&s.modal!=="preview")return;
  e.preventDefault();
  if(tile&&!range){
    stopPress();suppressTileClick=true;tile.focus({preventScroll:true});preview(Number(tile.dataset.id));
  }
});
document.addEventListener("keydown",e=>{
  if(s.modal&&e.key==="Escape"){e.preventDefault();if(s.modal==="system")actions["cancel-remove"]();else closeModal();return}
  if(s.modal&&e.key==="Tab"){
    const tabbable=[...layer.querySelectorAll("button:not(:disabled),[tabindex='0']")];
    if(!tabbable.length)return;
    if(e.shiftKey&&(!tabbable.includes(document.activeElement)||document.activeElement===tabbable[0])){e.preventDefault();tabbable.at(-1).focus()}
    else if(!e.shiftKey&&document.activeElement===tabbable.at(-1)){e.preventDefault();tabbable[0].focus()}
  }
  const el=e.target.closest?.('[data-a="tile"]');
  if(el&&!s.modal&&(e.key==="p"||e.key==="P"||e.key==="ContextMenu")){e.preventDefault();preview(Number(el.dataset.id))}
});
reset();
</script>
</body>
</html>
